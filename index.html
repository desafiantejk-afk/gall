<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Caja del restaurante</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--cd:#fff;--tx:#14202b;--mu:#64717e;--ac:#0f766e;--on:#fff;--am:#b45309;--bd:#d6dde3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161d;--cd:#17222c;--tx:#e8eef3;--mu:#8b99a6;--ac:#2dd4bf;--on:#06201d;--am:#fbbf24;--bd:#27343f}}
:root[data-theme="dark"]{--bg:#0e161d;--cd:#17222c;--tx:#e8eef3;--mu:#8b99a6;--ac:#2dd4bf;--on:#06201d;--am:#fbbf24;--bd:#27343f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Manrope,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-tap-highlight-color:transparent}
#main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
h2{margin:0;font-size:22px;font-weight:800}h3{margin:0 0 10px;font-size:19px;font-weight:800}h4{margin:18px 0 6px;font-size:15px}
small,.mu{color:var(--mu);font-size:13px}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button:disabled{opacity:.4}
button.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:800;width:100%;margin-top:8px}
button.g{background:transparent;border-color:transparent;color:var(--mu)}
button.x{min-height:36px;padding:4px 10px;color:var(--am)}
input,select{width:100%;border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:11px 12px;min-height:44px;margin-top:8px}
.sum{display:flex;justify-content:space-between;align-items:center;background:var(--ac);color:var(--on);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.sum b{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;min-height:78px}
.tb.occ{border:2px solid var(--am)}.tb.occ span{color:var(--am);font-weight:800}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chips button{white-space:nowrap;border-radius:20px}
.chips button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.it{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-weight:600}
.it span{color:var(--mu);font-weight:400;font-size:14px}
.ord{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:6px 12px;margin-top:14px}
.ln{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ln:last-child{border-bottom:0}.ln>div:first-child{flex:1}
.ln select{margin:0;width:auto}
.pr{font-weight:600;min-width:64px;text-align:right}
.qt{display:flex;align-items:center;gap:10px}.qt button{padding:4px 12px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:12px 0 4px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;font-size:13px;padding:6px 2px;border:0;border-radius:0;background:transparent;color:var(--mu);min-height:54px;font-weight:600}
.nav button.on{color:var(--ac);font-weight:800}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.mb{background:var(--bg);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.tk{background:var(--cd);border:1px dashed var(--mu);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.tk b{display:block}.tk small{display:block;margin-bottom:6px}
.rc{background:var(--cd);border-radius:10px;padding:14px;margin-bottom:8px}
.r{display:flex;justify-content:space-between;padding:3px 0}.r.tt{border-top:1px solid var(--bd);margin-top:6px;padding-top:8px;font-weight:800}
.big{font-size:34px;font-weight:800;margin:4px 0 8px}
.sf{position:relative;margin-top:8px}.sf input{margin-top:2px;padding-right:38px}.sf b{position:absolute;right:14px;bottom:12px;color:var(--mu)}.rc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}.rc .c{text-align:center}.rc hr{border:0;border-top:1px dashed var(--mu);margin:8px 0}
.plan{position:relative;height:62vh;min-height:320px;background:var(--cd);border:1px dashed var(--bd);border-radius:14px;overflow:hidden;touch-action:none}.tbp{position:absolute;width:20%;min-width:68px;min-height:64px;padding:6px;align-items:center;justify-content:center;text-align:center;user-select:none;touch-action:none}.tbp.ed{border:2px dashed var(--ac)}
@media print{body>*:not(#modal){display:none!important}#modal{position:static!important;background:none!important;display:block!important}.mb{max-height:none!important;overflow:visible!important;padding:0!important;background:#fff!important}.rc{background:#fff!important;color:#000!important}.mb button{display:none!important}}
.iv{width:100%;border-collapse:collapse}.iv th,.iv td{text-align:right;padding:2px 0}.iv th:first-child,.iv td:first-child{text-align:left}.iv th{font-weight:400;color:var(--mu);font-size:12px}.big2{font-size:26px;font-weight:800}
.form{margin:8px 0}
</style></head><body>
<div id="main"></div><div id="modal"></div>
<div class="nav"><button onclick="go('mesas')">Mesas</button><button onclick="go('plano')">Plano</button><button onclick="go('trans')">Cobros</button><button onclick="go('menu')">Menú</button><button onclick="go('mas')">Más</button></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>n.toFixed(2).replace('.',',')+' €';
const sf=(l,s,a)=>'<div class="sf"><small>'+l+'</small><input '+a+'><b>'+s+'</b></div>';
let S,v='mesas',T=null,F=-1,pay='Efectivo';
function load(){try{S=JSON.parse(localStorage.getItem('pos1'))}catch(e){}
 if(!S||!S.cats)S={dest:['Cocina','Salón'],cats:[{n:'Comidas',d:'Cocina'},{n:'Bebidas',d:'Salón'},{n:'Café',d:'Salón'}],
 items:[[1,'Hamburguesa',8,'Comidas'],[2,'Pasta',9,'Comidas'],[3,'Ensalada',6,'Comidas'],[4,'Refresco',2,'Bebidas'],[5,'Jugo natural',3,'Bebidas'],[6,'Agua',1,'Bebidas'],[7,'Café',1.5,'Café'],[8,'Capuchino',2.5,'Café']].map(a=>({id:a[0],n:a[1],p:a[2],c:a[3]})),
 tables:8,orders:{},sales:[],inv:1,iva:10};if(S.iva==null)S.iva=10;if(!S.svc)S.svc={open:false,id:0,t:0,fondo:0};if(!S.cierres)S.cierres=[];if(!S.pos)S.pos={}}
function save(){try{localStorage.setItem('pos1',JSON.stringify(S))}catch(e){}}
const cat=n=>S.cats.find(c=>c.n===n);
const item=id=>S.items.find(i=>i.id===id);
const lines=t=>S.orders[t]||[];
const lp=l=>(l.o!=null?l.o:(item(l.i)?item(l.i).p:0))+(l.m||[]).reduce((a,x)=>a+x.p,0);
const tot=t=>lines(t).reduce((a,l)=>a+l.q*lp(l),0);
const ir=id=>{const it=item(id);return it&&it.iva!=null?it.iva:S.iva};
const tl=t=>lines(t).map(l=>({q:l.q,p:lp(l),r:ir(l.i)}));
function calc(L,dp){const f=1-(dp||0)/100,R={};let g=0;L.forEach(x=>{const v=x.q*x.p*f;g+=v;R[x.r]=(R[x.r]||0)+v});return{sub:L.reduce((a,x)=>a+x.q*x.p,0),total:g,rows:Object.keys(R).map(r=>{const t=R[r],b=t/(1+r/100);return{r:+r,base:b,iva:t-b}})}}
const gt=tot;
let DP=0;
function go(x){v=x;T=null;render()}
function modal(h){const m=$('#modal');m.innerHTML='<div class="mb">'+h+'</div>';m.style.display='flex'}
function closeM(){$('#modal').style.display='none'}
function render(){
 $('#main').innerHTML=VW[v]();document.querySelectorAll('.nav button').forEach((b,i)=>b.className=TAB[v]===i+1?'on':'');
 }
function vMesas(){
 const td=new Date().toDateString();
 const day=S.sales.filter(s=>new Date(s.d).toDateString()===td).reduce((a,s)=>a+s.total,0);
 let g='';for(let i=1;i<=S.tables;i++){const n=lines(i).length;
  g+='<button class="tb '+(n?'occ':'')+'" onclick="openT('+i+')"><b>Mesa '+i+'</b><span>'+(n?money(gt(i)):'Libre')+'</span></button>'}
 const last=S.sales.slice(-5).reverse().map(s=>'<div class="ln"><div>Factura '+String(s.n).padStart(4,'0')+' <small>Mesa '+s.t+'</small></div><div class="pr">'+money(s.total)+'</div><button class="x" onclick="receipt(S.sales.find(z=>z.n=='+s.n+'))">Ver</button></div>').join('');
 return (S.svc.open?'':'<div class="tk"><b>Servicio cerrado</b><small>Ábrelo en Más → Apertura de servicio para poder cobrar.</small></div>')+'<div class="sum"><span>Ventas de hoy</span><b>'+money(day)+'</b></div><div class="grid">'+g+'</div>'+(last?'<h4>Últimas facturas</h4><div class="ord">'+last+'</div>':'')}
function openT(i){T=i;F=-1;v='mesa';render()}
function setF(i){F=i;render()}
function vMesa(){
 const L=lines(T),pend=L.reduce((a,l)=>a+l.q-l.s,0),fc=F>=0&&S.cats[F]?S.cats[F].n:'';
 const chips='<button class="'+(F<0?'on':'')+'" onclick="setF(-1)">Todo</button>'+S.cats.map((c,i)=>'<button class="'+(F===i?'on':'')+'" onclick="setF('+i+')">'+esc(c.n)+'</button>').join('');
 const its=S.items.filter(i=>!fc||i.c===fc).map(i=>'<button class="it" onclick="add('+i.id+')">'+esc(i.n)+'<span>'+money(i.p)+'</span></button>').join('');
 const ol=L.map((l,x)=>{const it=item(l.i);return '<div class="ln"><div>'+esc(it.n)+((l.m||[]).length?' <small>'+esc(l.m.map(z=>z.n).join(', '))+'</small>':'')+(l.s>=l.q?' <small>enviado'+(l.ts?' '+hh(l.ts)+' · '+ago(l.ts):'')+'</small>':l.s?' <small>+'+(l.q-l.s)+' nuevo</small>':'')+'</div><div class="qt"><button onclick="chg('+x+',-1)">−</button><b>'+l.q+'</b><button onclick="chg('+x+',1)">+</button></div><button class="g pr" onclick="priceM('+x+')">'+money(l.q*lp(l))+(l.o!=null?'*':'')+'</button></div>'}).join('')||'<p class="mu">Toca un plato o una bebida para añadirlo.</p>';
 return '<div class="bar"><button class="g" onclick="go(\'mesas\')">← Mesas</button><h2>Mesa '+T+'</h2></div><div class="chips">'+chips+'</div><div class="items">'+its+'</div><div class="ord">'+ol+'<div class="tot"><span>Total</span><span>'+money(gt(T))+'</span></div></div><div class="acts"><button class="p" '+(pend?'':'disabled')+' onclick="send()">Enviar ('+pend+')</button><button class="p" '+(L.length?'':'disabled')+' onclick="DP=0;PY=[];payM()">Cobrar</button></div>'}
let PM=[];
function add(id){const it=item(id);if((it.mods||[]).length){PM=[];modMenu(id)}else addL(id,[])}
function modMenu(id,w){const it=item(id);modal('<h3>'+esc(it.n)+'</h3>'+(it.req?'<p class="'+(w?'':'mu')+'" style="'+(w?'color:var(--am)':'')+'">Obligatorio: elige al menos uno.</p>':'')+'<div class="chips" style="flex-wrap:wrap">'+it.mods.map((x,j)=>'<button class="'+(PM.includes(j)?'on':'')+'" onclick="togM('+id+','+j+')">'+esc(x.n)+(x.p?' +'+money(x.p):'')+'</button>').join('')+'</div><button class="p" onclick="okM('+id+')">Añadir a la mesa</button><button class="g" style="width:100%" onclick="closeM()">Cancelar</button>')}
function togM(id,j){PM=PM.includes(j)?PM.filter(z=>z!==j):PM.concat(j);modMenu(id)}
function okM(id){const it=item(id);if(it.req&&!PM.length)return modMenu(id,1);addL(id,PM.map(j=>({n:it.mods[j].n,p:it.mods[j].p})));closeM()}
function addL(id,m){const L=S.orders[T]=lines(T);const k=m.map(x=>x.n).join('|');const l=L.find(x=>x.i===id&&(x.m||[]).map(z=>z.n).join('|')===k);if(l)l.q++;else L.push({i:id,q:1,s:0,m:m});save();render()}
function chg(id,d){const L=lines(T),l=L[id];if(!l)return;l.q+=d;if(l.s>l.q)l.s=l.q;if(l.q<=0)L.splice(L.indexOf(l),1);if(!L.length)delete S.orders[T];save();render()}
function send(){const by={};
 lines(T).forEach(l=>{const q=l.q-l.s;if(q>0){const it=item(l.i),c=cat(it.c),d=c?c.d:S.dest[0];(by[d]=by[d]||[]).push(q+'× '+it.n+((l.m||[]).length?' ('+l.m.map(x=>x.n).join(', ')+')':''));l.s=l.q;l.ts=Date.now()}});
 save();const hr=new Date().toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
 modal('<h3>Pedido enviado</h3>'+Object.keys(by).map(d=>'<div class="tk"><b>'+esc(d)+'</b><small>Mesa '+T+' · '+hr+'</small>'+by[d].map(x=>'<div>'+esc(x)+'</div>').join('')+'</div>').join('')+'<p class="mu">Vista previa de los tickets. La impresión real se conecta en la etapa 3.</p><button class="p" onclick="closeM()">Listo</button>');render()}
function payM(){if(!S.svc.open)return modal('<h3>Servicio cerrado</h3><p class="mu">Abre el servicio en Más → Apertura de servicio para poder cobrar.</p><button class="p" onclick="closeM();goMas()">Ir a Más</button>');return payN();modal('<h3>Cobrar Mesa '+T+'</h3><div class="big" id="pt">'+money(calc(tl(T),DP).total)+'</div>'+sf('Descuento (opcional)','%','type="number" inputmode="decimal" value="'+(DP||'')+'" oninput="payTot(this.value)"')+'<div class="chips">'+['Efectivo','Tarjeta'].map(m=>'<button class="'+(pay===m?'on':'')+'" onclick="pay=\''+m+'\';payM()">'+m+'</button>').join('')+'</div>'+cashBox()+'<button class="p" onclick="charge()">Confirmar cobro</button><button class="g" style="width:100%" onclick="closeM()">Cancelar</button>')}
function charge(){const c=calc(tl(T),DP);const L=lines(T).map(l=>{const it=item(l.i);return{n:it.n+((l.m||[]).length?' ('+l.m.map(x=>x.n).join(', ')+')':''),q:l.q,p:lp(l),r:ir(l.i)}});
 const s={n:S.inv++,t:T,d:Date.now(),L:L,sub:c.sub,disc:c.sub-c.total,rows:c.rows,total:c.total,m:PY.length>1?'Mixto':PY[0].m,pays:PY.map(x=>({m:x.m,a:x.a,g:x.g||null})),sv:S.svc.id};S.sales.push(s);delete S.orders[T];save();v='mesas';T=null;render();receipt(s)}
function receipt(s){modal(rcBody(s)+'<button class="p" onclick="closeM()">Cerrar</button>')}
function rcBody(s){const d=new Date(s.d);return '<div class="rc">'+tkHead()+'<h3>Ticket Nº '+String(s.n).padStart(4,'0')+'</h3><small>'+d.toLocaleString('es')+' · Mesa '+s.t+'</small><div style="height:8px"></div>'+s.L.map(l=>'<div class="r"><span>'+l.q+'× '+esc(l.n)+(l.r!=null?' <small>IVA '+l.r+'%</small>':'')+'</span><span>'+money(l.q*l.p)+'</span></div>').join('')+(s.disc>0.004?'<div class="r"><span>Descuento</span><span>−'+money(s.disc)+'</span></div>':'')+(s.rows&&s.rows.length?'<hr><table class="iv"><tr><th>IVA consumido</th><th>Sin IVA</th><th>IVA</th></tr>'+s.rows.map(x=>'<tr><td>'+x.r+'%</td><td>'+money(x.base)+'</td><td>'+money(x.iva)+'</td></tr>').join('')+'</table><div class="r"><span>Precio sin IVA</span><span>'+money(s.rows.reduce((a,x)=>a+x.base,0))+'</span></div><div class="r"><span>IVA total</span><span>'+money(s.rows.reduce((a,x)=>a+x.iva,0))+'</span></div>':'')+'<hr><div class="r big2"><span>TOTAL con IVA</span><span>'+money(s.total)+'</span></div>'+pmRows(s)+tkFoot()+'</div>'}
function vMenu(){
 const co=S.cats.map(c=>'<option>'+esc(c.n)+'</option>').join('');
 const ls=S.cats.map((c,ci)=>'<div class="bar" style="margin-top:12px"><button class="tb" style="flex:1;flex-direction:row;align-items:center;min-height:52px;gap:10px" onclick="togC('+ci+')"><b>'+(OP.includes(c.n)?'▾':'▸')+'</b><span style="flex:1;text-align:left"><b>'+esc(c.n)+'</b> <small>'+S.items.filter(i=>i.c===c.n).length+' · sale en '+esc(c.d)+'</small></span></button><button class="p" style="width:auto;margin:0;min-height:38px" onclick="newItem('+ci+')">+ Añadir plato</button></div>'+(OP.includes(c.n)?'<div class="ord">'+(S.items.filter(i=>i.c===c.n).map(i=>'<div class="ln"><div>'+esc(i.n)+((i.mods||[]).length?' <small>'+i.mods.map(x=>esc(x.n)).join(', ')+'</small>':'')+'</div><div class="pr">'+money(i.p)+'</div><button class="x" onclick="editItem('+i.id+')">Editar</button><button class="x" onclick="delItem('+i.id+')">Quitar</button></div>').join('')||'<p class="mu">Sin productos.</p>')+'</div>':'')).join('');
 return '<h2>Menú</h2>'+ls}

function editItem(id){const it=item(id);if(!it)return;D={id:id,n:it.n,p:it.p,v:it.iva!=null?it.iva:S.iva,c:it.c,req:!!it.req,mods:(it.mods||[]).map(x=>({n:x.n,p:x.p}))};
 dishM()}
let D=null;
function newItem(i){D={n:'',p:'',v:S.iva,c:S.cats[i].n,req:false,mods:[]};dishM()}
function dishM(){modal('<h3>'+(D.id?'Editar plato':'Nuevo plato en '+esc(D.c))+'</h3><input placeholder="Nombre" value="'+esc(D.n)+'" oninput="D.n=this.value">'+sf('Precio (IVA incluido)','€','type="number" step="0.01" inputmode="decimal" value="'+D.p+'" oninput="D.p=this.value"')+sf('IVA de este plato','%','type="number" step="0.01" inputmode="decimal" value="'+D.v+'" oninput="D.v=this.value"')+'<select onchange="D.c=this.value">'+S.cats.map(c=>'<option '+(c.n===D.c?'selected':'')+'>'+esc(c.n)+'</option>').join('')+'</select><h4>Modificantes</h4><div class="chips"><button class="'+(D.req?'on':'')+'" onclick="D.req=!D.req;dishM()">'+(D.req?'✓ ':'')+'Obligatorio elegir uno</button></div>'+D.mods.map((x,j)=>'<div class="ln"><div>'+esc(x.n)+'</div><div class="pr">'+(x.p?'+'+money(x.p):'gratis')+'</div><button class="x" onclick="D.mods.splice('+j+',1);dishM()">Quitar</button></div>').join('')+'<input id="mn" placeholder="Ej. Pan integral">'+sf('Precio extra (vacío = gratis)','€','id="mp" type="number" step="0.01" inputmode="decimal"')+'<button style="width:100%;margin-top:8px" onclick="addMod()">Añadir modificante</button><button class="p" onclick="saveD()">Guardar plato</button><button class="g" style="width:100%" onclick="closeM()">Cancelar</button>')}
function addMod(){const n=$('#mn').value.trim();if(!n)return;D.mods.push({n:n,p:parseFloat($('#mp').value)||0});dishM()}
function saveD(){const p=parseFloat(D.p),nm=D.n.trim(),iv=isNaN(parseFloat(D.v))?S.iva:parseFloat(D.v);if(!nm||isNaN(p))return;const n=$('#mn').value.trim();if(n)D.mods.push({n:n,p:parseFloat($('#mp').value)||0});if(D.id){const it=item(D.id);it.n=nm;it.p=p;it.c=D.c;it.iva=iv;it.req=!!D.req;it.mods=D.mods}else S.items.push({id:Date.now(),n:nm,p:p,c:D.c,iva:iv,req:!!D.req,mods:D.mods});save();closeM();render()}
function priceM(x){const l=lines(T)[x],it=item(l.i);modal('<h3>Ajustar precio</h3><p class="mu">'+esc(it.n)+' · precio por unidad, IVA incluido</p>'+sf('Precio por unidad (IVA incluido)','€','id="op" type="number" step="0.01" inputmode="decimal" value="'+(l.o!=null?l.o:it.p)+'"')+'<button class="p" onclick="setP('+x+')">Guardar precio</button><button class="g" style="width:100%" onclick="setP('+x+',1)">Volver al precio del menú</button>')}

function pmRows(s){const P=pays(s);return '<div class="r"><span>Forma de pago</span><span>'+(P.length>1?'Mixto':esc(P[0].m))+'</span></div>'+(P.length>1?P.map(x=>'<div class="r"><small>'+esc(x.m)+'</small><small>'+money(x.a)+'</small></div>').join(''):'')+P.filter(x=>x.g).map(x=>'<div class="r"><small>Entregado</small><small>'+money(x.g)+'</small></div><div class="r"><small>Cambio</small><small>'+money(x.g-x.a)+'</small></div>').join('')}
function tkHead(){const k=S.tk||{};const l=[k.name&&'<b>'+esc(k.name)+'</b>',k.nif&&'NIF: '+esc(k.nif),k.addr&&esc(k.addr),k.tel&&'Tel: '+esc(k.tel),k.mail&&esc(k.mail)].filter(Boolean);return l.length?'<div class="c">'+l.join('<br>')+'</div><hr>':''}
function tkFoot(){const k=S.tk||{};return k.foot?'<hr><div class="c">'+esc(k.foot)+'</div>':''}
const TK=['name','nif','addr','tel','mail','foot'];
const TKL=['Nombre del negocio','NIF / CIF','Dirección','Teléfono','Email o web (opcional)','Mensaje final (ej. ¡Gracias por su visita!)'];
function tkSet(i,v){S.tk=S.tk||{};S.tk[TK[i]]=v;save();$('#tkp').innerHTML=rcBody(demo())}
function demo(){const L=[{q:1,p:3,r:10},{q:2,p:1.5,r:10},{q:1,p:2.5,r:21}];return{n:1,t:3,d:Date.now(),L:[{n:'Desayuno',q:1,p:3,r:10},{n:'Café con leche',q:2,p:1.5,r:10},{n:'Refresco',q:1,p:2.5,r:21}],disc:0,rows:calc(L,0).rows,total:8.5,m:'Efectivo',g:10}}
function autoBox(){const a=S.auto||(S.auto={on:false,model:'',ip:''});return '<h4>Cobro automático</h4><p class="mu">Cada fabricante de caja automática o datáfono tiene su propio sistema. Guarda aquí los datos; la conexión real se hace después, con la documentación de tu modelo.</p><div class="chips"><button class="'+(a.on?'':'on')+'" onclick="setAuto(false)">Desactivado</button><button class="'+(a.on?'on':'')+'" onclick="setAuto(true)">Activado</button></div><input placeholder="Marca y modelo del equipo" value="'+esc(a.model)+'" oninput="S.auto.model=this.value;save()"><input placeholder="Dirección IP del equipo (si tiene)" value="'+esc(a.ip)+'" oninput="S.auto.ip=this.value;save()">'}
function setAuto(b){S.auto=S.auto||{on:false,model:'',ip:''};S.auto.on=b;save();render()}
function delItem(id){S.items=S.items.filter(i=>i.id!==id);for(const t in S.orders){S.orders[t]=S.orders[t].filter(l=>l.i!==id);if(!S.orders[t].length)delete S.orders[t]}save();render()}
function vAj(){
 const ds=S.dest.map((d,i)=>'<div class="ln"><div>'+esc(d)+'</div>'+(S.dest.length>1?'<button class="x" onclick="delDest('+i+')">Quitar</button>':'')+'</div>').join('');
 const cs=S.cats.map((c,i)=>'<div class="ln"><div>'+esc(c.n)+'</div><select onchange="setCD('+i+',this.value)">'+S.dest.map(d=>'<option '+(d===c.d?'selected':'')+'>'+esc(d)+'</option>').join('')+'</select><button class="x" onclick="delCat('+i+')">Quitar</button></div>').join('');
 return '<h2>Ajustes</h2><h4>Impresoras y destinos</h4><div class="ord">'+ds+'</div><div class="form"><input id="nd" placeholder="Ej. Barra, Terraza"><button class="p" onclick="addDest()">Añadir destino</button></div><h4>¿Dónde sale cada categoría?</h4><div class="ord">'+cs+'</div><div class="form"><input id="nc" placeholder="Nueva categoría"><button class="p" onclick="addCat()">Añadir categoría</button></div><h4>Ticket de caja</h4>'+TKL.map((t,i)=>'<input placeholder="'+t+'" value="'+esc((S.tk||{})[TK[i]]||'')+'" oninput="tkSet('+i+',this.value)">').join('')+'<small>Así se verá al imprimir:</small><div id="tkp">'+rcBody(demo())+'</div>'+autoBox()+devBox()+'<h4>IVA por defecto (%)</h4><p class="mu">Los precios ya incluyen el IVA. Cada plato puede tener su propio porcentaje al editarlo.</p>'+sf('IVA por defecto','%','type="number" inputmode="decimal" value="'+S.iva+'" oninput="S.iva=parseFloat(this.value)||0;save()"')+'<h4>Cantidad de mesas</h4><div class="qt"><button onclick="setTb(-1)">−</button><b>'+S.tables+'</b><button onclick="setTb(1)">+</button></div>'}
function addDest(){const n=$('#nd').value.trim();if(!n||S.dest.includes(n))return;S.dest.push(n);save();render()}
function delDest(i){const d=S.dest.splice(i,1)[0];S.cats.forEach(c=>{if(c.d===d)c.d=S.dest[0]});save();render()}
function setCD(i,d){S.cats[i].d=d;save()}
function addCat(){const n=$('#nc').value.trim();if(!n||cat(n))return;S.cats.push({n:n,d:S.dest[0]});save();render()}
function delCat(i){const n=S.cats.splice(i,1)[0].n;S.items.filter(x=>x.c===n).forEach(x=>delItem(x.id));save();render()}
function setTb(d){S.tables=Math.max(1,Math.min(60,S.tables+d));save();render()}
const VW={mesas:vMesas,mesa:vMesa,plano:vPlano,trans:vTrans,menu:vMenu,mas:vMas,vivo:vVivo,cierre:vCierre,apertura:vApert,aj:vAj};
const TAB={mesas:1,mesa:1,plano:2,trans:3,menu:4,mas:5,vivo:5,cierre:5,apertura:5,aj:5};
const MAS=['vivo','apertura','cierre','aj'];
const RB='style="width:100%;flex-direction:row;justify-content:space-between;align-items:center;margin-bottom:8px"';
function goMas(){go('mas')}
let TD=new Date().toDateString(),ED=false,FD=0,CT=0;
function vTrans(){const L=S.sales.filter(s=>new Date(s.d).toDateString()===TD).sort((a,b)=>b.d-a.d),sum=L.reduce((a,s)=>a+s.total,0);
 return '<h2>Transacciones</h2><div class="bar" style="margin-top:10px"><button onclick="shDay(-1)">←</button><b style="flex:1;text-align:center">'+new Date(TD).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+'</b><button onclick="shDay(1)">→</button></div><div class="sum"><span>'+L.length+' mesas cerradas</span><b>'+money(sum)+'</b></div>'+(L.map(s=>'<button class="tb" '+RB+' onclick="trM('+s.n+')"><span><b>Mesa '+s.t+'</b> <small>'+new Date(s.d).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})+' · '+esc(s.m)+'</small></span><b>'+money(s.total)+'</b></button>').join('')||'<p class="mu">No hay mesas cerradas este día.</p>')}
function shDay(d){const x=new Date(TD);x.setDate(x.getDate()+d);TD=x.toDateString();render()}
function trM(n){const s=S.sales.find(z=>z.n===n);modal(rcBody(s)+'<h4>Forma de pago</h4><div class="chips">'+PMS.map((m,j)=>'<button class="'+(s.m===m?'on':'')+'" onclick="setPm('+n+','+j+')">'+m+'</button>').join('')+'</div><button class="p" onclick="window.print()">Imprimir cuenta</button><button class="g" style="width:100%" onclick="closeM()">Cerrar</button>')}
function setPm(n,j){const s=S.sales.find(z=>z.n===n);s.m=PMS[j];s.pays=[{m:PMS[j],a:s.total,g:null}];s.g=null;save();trM(n);render()}
const dp=i=>S.pos[i]||{x:((i-1)%4)*24+3,y:Math.floor((i-1)/4)*22+4};
function vPlano(){let h='';for(let i=1;i<=S.tables;i++){const p=dp(i),n=lines(i).length;h+='<div class="tb tbp '+(n?'occ':'')+(ED?' ed':'')+'" data-i="'+i+'" style="left:'+p.x+'%;top:'+p.y+'%" onpointerdown="dragS(event)" onclick="if(!ED)openT('+i+')"><b>Mesa '+i+'</b><small>'+(n?money(gt(i)):'Libre')+'</small></div>'}
 return '<div class="bar"><h2 style="flex:1">Plano de mesas</h2><button class="'+(ED?'p':'')+'" style="'+(ED?'width:auto;margin:0':'')+'" onclick="ED=!ED;render()">'+(ED?'Listo':'Editar')+'</button></div>'+(ED?'<div class="acts" style="margin-bottom:8px"><button onclick="setTb(1)">+ Mesa</button><button onclick="if(!lines(S.tables).length)setTb(-1)">− Mesa</button></div>':'')+'<div class="plan" id="plan">'+h+'</div>'+(ED?'<p class="mu">Arrastra las mesas para colocarlas donde quieras.</p>':'')}
function dragS(e){if(!ED)return;const el=e.currentTarget,pl=$('#plan').getBoundingClientRect(),i=el.dataset.i;el.setPointerCapture(e.pointerId);
 const mv=ev=>{const x=Math.max(0,Math.min(100-el.offsetWidth/pl.width*100,(ev.clientX-pl.left-el.offsetWidth/2)/pl.width*100)),y=Math.max(0,Math.min(100-el.offsetHeight/pl.height*100,(ev.clientY-pl.top-el.offsetHeight/2)/pl.height*100));el.style.left=x+'%';el.style.top=y+'%';S.pos[i]={x:x,y:y}};
 const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);save()};
 el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)}
function vMas(){const it=[['Ventas en tiempo real','Lo vendido ahora, incluso mesas sin cobrar'],['Apertura de servicio',S.svc.open?'Servicio abierto':'Servicio cerrado'],['Cierre de caja','Resumen del servicio y arqueo'],['Ajustes','Ticket, IVA, destinos y mesas']];
 return '<h2>Más</h2><div style="height:10px"></div>'+it.map((a,i)=>'<button class="tb" '+RB+' onclick="go(MAS['+i+'])"><span><b>'+a[0]+'</b><br><small>'+a[1]+'</small></span><span>›</span></button>').join('')}
const BK='<div class="bar"><button class="g" onclick="goMas()">← Más</button></div>';
const curS=()=>S.svc.open?S.sales.filter(s=>s.sv===S.svc.id):[];
function vVivo(){if(!S.svc.open)return BK+'<h2>Ventas en tiempo real</h2><p class="mu">El servicio está cerrado. Ábrelo en Apertura de servicio.</p>';
 const C=curS(),cob=C.reduce((a,s)=>a+s.total,0),by={},op=[];C.forEach(s=>pays(s).forEach(p=>by[p.m]=(by[p.m]||0)+p.a));for(let i=1;i<=S.tables;i++)if(lines(i).length)op.push([i,gt(i)]);const pen=op.reduce((a,x)=>a+x[1],0);
 return BK+'<h2>Ventas en tiempo real</h2><div class="sum" style="margin-top:10px"><span>Vendido en total</span><b>'+money(cob+pen)+'</b></div><div class="ord"><div class="r"><span>Cobrado</span><b>'+money(cob)+'</b></div>'+PMS.map(m=>'<div class="r"><small>'+m+'</small><small>'+money(by[m]||0)+'</small></div>').join('')+'<div class="r"><span>Pendiente de cobro</span><b>'+money(pen)+'</b></div><div class="r"><small>Mesas cerradas</small><small>'+C.length+'</small></div>'+(C.length?'<div class="r"><small>Ticket medio</small><small>'+money(cob/C.length)+'</small></div>':'')+'</div>'+(op.length?'<h4>Mesas abiertas</h4><div class="ord">'+op.map(x=>'<div class="ln"><div>Mesa '+x[0]+'</div><div class="pr">'+money(x[1])+'</div></div>').join('')+'</div>':'')}
function vApert(){const s=S.svc;return BK+'<h2>Apertura de servicio</h2>'+(s.open?'<div class="ord"><p>Servicio abierto desde las <b>'+new Date(s.t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})+'</b></p><div class="r"><span>Fondo de caja</span><b>'+money(s.fondo)+'</b></div></div><p class="mu">Para terminar, ve a Cierre de caja.</p>':'<p class="mu">Cuenta el efectivo que dejas en la caja e inicia el servicio.</p>'+sf('Fondo de caja inicial','€','type="number" inputmode="decimal" value="'+(FD||'')+'" oninput="FD=parseFloat(this.value)||0"')+'<button class="p" onclick="openSvc()">Abrir servicio</button>')}
function openSvc(){S.svc={open:true,id:Date.now(),t:Date.now(),fondo:FD};FD=0;save();render()}
function cierreCalc(){const C=curS(),by={},tt=C.reduce((a,s)=>a+s.total,0),R={};C.forEach(s=>pays(s).forEach(p=>by[p.m]=(by[p.m]||0)+p.a));const ef=by.Efectivo||0;C.forEach(s=>(s.rows||[]).forEach(x=>{const r=R[x.r]||(R[x.r]={r:x.r,base:0,iva:0});r.base+=x.base;r.iva+=x.iva}));return{n:C.length,by:by,ef:ef,total:tt,fondo:S.svc.fondo,rows:Object.values(R)}}

function cierreHTML(c){return '<div class="rc"><h3>Cierre de caja</h3><small>'+new Date(c.t0).toLocaleString('es')+' → '+new Date(c.t1).toLocaleString('es')+'</small><div style="height:8px"></div><div class="r"><span>Tickets</span><span>'+c.n+'</span></div>'+PMS.map(m=>'<div class="r"><span>Cobrado en '+m.toLowerCase()+'</span><span>'+money((c.by||{Efectivo:c.ef,Tarjeta:c.tj})[m]||0)+'</span></div>').join('')+'<div class="r tt"><span>Total ventas</span><span>'+money(c.total)+'</span></div>'+c.rows.map(x=>'<div class="r"><small>Base '+money(x.base)+' · IVA '+x.r+'%</small><small>'+money(x.iva)+'</small></div>').join('')+'<hr><div class="r"><span>Fondo inicial</span><span>'+money(c.fondo)+'</span></div><div class="r"><span>Efectivo esperado</span><span>'+money(c.fondo+c.ef)+'</span></div>'+(c.cont!=null?'<div class="r"><span>Efectivo contado</span><span>'+money(c.cont)+'</span></div><div class="r tt"><span>Diferencia</span><span>'+money(c.cont-c.fondo-c.ef)+'</span></div>':'')+'</div>'}
function vCierre(){const hist=S.cierres.slice(-8).reverse().map((c,i)=>'<button class="tb" '+RB+' onclick="hisM('+(S.cierres.length-1-i)+')"><span>'+new Date(c.t1).toLocaleDateString('es')+' <small>'+c.n+' tickets</small></span><b>'+money(c.total)+'</b></button>').join('');
 if(!S.svc.open)return BK+'<h2>Cierre de caja</h2><p class="mu">No hay ningún servicio abierto.</p>'+(hist?'<h4>Cierres anteriores</h4>'+hist:'');
 return BK+'<h2>Cierre de caja</h2><div id="cr" style="margin-top:10px">'+cierreHTML(crObj())+'</div>'+sf('Efectivo contado en caja','€','type="number" inputmode="decimal" value="'+(CT||'')+'" oninput="crUp(this.value)"')+'<button class="p" onclick="closeSvc()">Cerrar servicio y guardar cierre</button>'+(hist?'<h4>Cierres anteriores</h4>'+hist:'')}
function crUp(v){CT=parseFloat(v)||0;$('#cr').innerHTML=cierreHTML(crObj())}
function hisM(i){modal(cierreHTML(S.cierres[i])+'<button class="p" onclick="window.print()">Imprimir</button><button class="g" style="width:100%" onclick="closeM()">Cerrar</button>')}
function closeSvc(){const op=[];for(let i=1;i<=S.tables;i++)if(lines(i).length)op.push(i);
 if(op.length)return modal('<h3>Hay mesas sin cobrar</h3><p class="mu">Cobra las mesas '+op.join(', ')+' antes de cerrar la caja.</p><button class="p" onclick="closeM()">Entendido</button>');
 S.cierres.push(crObj());S.svc={open:false,id:0,t:0,fondo:0};CT=0;save();render();hisM(S.cierres.length-1)}
const OP=[];
const hh=t=>new Date(t).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
const ago=t=>{const m=Math.floor((Date.now()-t)/60000);return m<1?'ahora':'hace '+m+' min'};
function togC(i){const n=S.cats[i].n,k=OP.indexOf(n);if(k<0)OP.push(n);else OP.splice(k,1);render()}
function devBox(){const L=S.devs||(S.devs=[]);return '<h4>Dispositivos</h4><p class="mu">Registra tus impresoras, tablets y móviles. La conexión real se hace en la etapa de impresoras.</p><div class="ord">'+(L.map((d,i)=>'<div class="ln"><div><b>'+esc(d.n)+'</b><br><small>'+esc(d.t)+(d.ip?' · '+esc(d.ip):'')+(d.d?' · sale: '+esc(d.d):'')+'</small></div><button class="x" onclick="delDev('+i+')">Quitar</button></div>').join('')||'<p class="mu">Sin dispositivos.</p>')+'</div><div class="form"><select id="dt"><option>Impresora</option><option>Tablet</option><option>Móvil</option></select><input id="dn" placeholder="Nombre (ej. Impresora cocina)"><input id="di" placeholder="IP o Bluetooth (si tiene)"><select id="dd"><option value="">Sin destino</option>'+S.dest.map(d=>'<option>'+esc(d)+'</option>').join('')+'</select><button class="p" onclick="addDev()">Añadir dispositivo</button></div>'}
function addDev(){const n=$('#dn').value.trim();if(!n)return;(S.devs=S.devs||[]).push({t:$('#dt').value,n:n,ip:$('#di').value.trim(),d:$('#dd').value});save();render()}
function delDev(i){S.devs.splice(i,1);save();render()}
let PY=[];
const PMS=['Efectivo','Tarjeta','Online','Bizum'];
const due=()=>calc(tl(T),DP).total;
const paid=()=>PY.reduce((a,x)=>a+x.a,0);
function payN(){const tt=due(),rest=Math.max(0,tt-paid());
 return modal('<h3>Cobrar Mesa '+T+'</h3><div class="big">'+money(tt)+'</div>'+sf('Descuento (opcional)','%','type="number" inputmode="decimal" value="'+(DP||'')+'" onchange="DP=parseFloat(this.value)||0;PY=[];payN()"')+(S.auto&&S.auto.on?'<div class="tk"><small>Caja automática activada: cobra el efectivo en la caja y regístralo aquí.</small></div>':'')+(PY.length?'<div class="ord">'+PY.map((x,i)=>'<div class="ln"><div>'+x.m+(x.g?' <small>entregado '+money(x.g)+'</small>':'')+'</div><div class="pr">'+money(x.a)+'</div><button class="x" onclick="PY.splice('+i+',1);payN()">Quitar</button></div>').join('')+'</div>':'')+(rest>0.004?'<div class="r tt"><span>Falta por cobrar</span><span>'+money(rest)+'</span></div>'+sf('Importe (vacío = lo que falta)','€','id="pi" type="number" inputmode="decimal"')+'<div class="chips">'+PMS.map((m,j)=>'<button onclick="addPy('+j+')">'+m+'</button>').join('')+'</div>':'<div class="r"><span>Cambio a devolver</span><b>'+money(PY.reduce((a,x)=>a+(x.g?x.g-x.a:0),0))+'</b></div>')+'<button class="p" '+(rest>0.004||!PY.length?'disabled':'')+' onclick="charge()">Confirmar cobro</button><button class="g" style="width:100%" onclick="closeM()">Cancelar</button>')}

load();render();
